data:
  seed: 42
  sample_rate: 16000
  max_duration_seconds: 4.0
  mono: true

features:
  type: "logmel"
  n_mels: 80
  n_fft: 512
  hop_length: 160
  win_length: 400
  f_min: 20.0
  f_max: 8000.0
  normalize: true

model:
  name: "lcnn"
  input_channels: 1
  hidden_dim: 160
  dropout: 0.5

training:
  batch_size: 8
  epochs: 5
  num_workers: 0
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss: "bce"

cache:
  use_cached_features: true
  cache_dir: "cache"

evaluation:
  metrics: ["eer", "auc", "f1", "accuracy"]
  threshold: 0.5
